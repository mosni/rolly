# rolly.mosni.dev → node app (websockets)
# TLS is committed here (not injected by `certbot --nginx`): lib/deploy keeps a committed 443 block
# as-is, so `git reset --hard` on redeploy can never drop it. certbot only RENEWS the cert files.
server {
    server_name rolly.mosni.dev;
    location / {
        proxy_pass http://127.0.0.1:33012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rolly.mosni.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolly.mosni.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# rolly.mosni.dev — HTTP → HTTPS
server {
    server_name rolly.mosni.dev;
    listen 80;
    return 301 https://$host$request_uri;
}
